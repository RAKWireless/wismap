name: Sync catalog from wisblock-data

# data/{definitions,config,rules}.yml are generated by wisblock-data and
# vendored here. This job pulls the current upstream artifacts, regenerates the
# downstream contract fixtures to match, and opens a pull request when anything
# moved. It never pushes to master: a catalog change alters what the API
# reports, so it goes through review like any other change.
#
# Setup required once:
#   - secrets.WISBLOCK_DATA_TOKEN — a token with read access to the upstream
#     repository. Needed only while it is private: sharing an organisation
#     does not let one repository's GITHUB_TOKEN read another's, so without
#     this the checkout below 404s. Once wisblock-data is public the fallback
#     token is enough and the secret can be deleted.
#   - Settings > Actions > General > "Allow GitHub Actions to create and
#     approve pull requests", so the PR step can use GITHUB_TOKEN.
#
# Known limitation: a branch pushed with GITHUB_TOKEN does not trigger other
# workflows, so ci.yml will not run on the PR this job opens. Set
# secrets.SYNC_PR_TOKEN to a PAT to get CI on sync PRs; without it, run the
# checks locally before merging.

on:
  schedule:
    # Daily, early UTC. The upstream repo publishes on a human cadence, so
    # anything more frequent just produces empty runs.
    - cron: "17 5 * * *"
  workflow_dispatch:
  # Lets wisblock-data announce a new dist/ instead of waiting for the cron:
  #   gh api repos/rakwireless/wismap/dispatches \
  #     -f event_type=wisblock-data-updated
  repository_dispatch:
    types: [wisblock-data-updated]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-data
  cancel-in-progress: false

env:
  SYNC_BRANCH: chore/sync-wisblock-data

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_PR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Check out wisblock-data
        uses: actions/checkout@v4
        with:
          repository: RAKWireless/wisblock-data
          ref: master
          token: ${{ secrets.WISBLOCK_DATA_TOKEN || github.token }}
          path: .upstream/wisblock-data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Sync catalog
        run: make sync-data WISBLOCK_DATA=.upstream/wisblock-data

      # The fixtures are derived from the catalog, so a sync that leaves them
      # behind ships a contract the server no longer honours. Regenerating here
      # means the PR carries the data change and its consequences together.
      - name: Regenerate consumer fixtures
        run: python tests/fixtures/_generate.py

      - name: Verify the synced tree
        run: |
          make check-data WISBLOCK_DATA=.upstream/wisblock-data
          make check-fixtures
          make check-openapi

      - name: Open or update the sync PR
        env:
          GH_TOKEN: ${{ secrets.SYNC_PR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet -- data tests/fixtures; then
            echo "Already up to date with upstream — nothing to propose."
            exit 0
          fi

          upstream_commit=$(git -C .upstream/wisblock-data rev-parse --short HEAD)
          upstream_subject=$(git -C .upstream/wisblock-data log -1 --format=%s)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$SYNC_BRANCH"
          git add data tests/fixtures
          git commit -m "Sync catalog from wisblock-data@${upstream_commit}" \
                     -m "Upstream: ${upstream_subject}"
          git push --force-with-lease origin "$SYNC_BRANCH"

          body=$(cat <<EOF
          Automated sync of \`data/{definitions,config,rules}.yml\` from
          [wisblock-data](https://github.com/RAKWireless/wisblock-data)@\`${upstream_commit}\`
          (_${upstream_subject}_), with \`tests/fixtures/\` regenerated to match.

          These files are generated upstream and vendored here — review the data diff for
          intent, not for style, and take any correction back to wisblock-data.

          Before merging, check the fixture diff: it is the machine-readable statement of
          what changes for the WisBlock Code Generator.
          EOF
          )

          if gh pr view "$SYNC_BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$SYNC_BRANCH" --body "$body"
            echo "Updated the open sync PR."
          else
            gh pr create --base master --head "$SYNC_BRANCH" \
              --title "Sync catalog from wisblock-data@${upstream_commit}" \
              --body "$body"
          fi
