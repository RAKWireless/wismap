rak15000:
  type: WisSensor
  description: RAK15000 EEPROM Module
  documentation: https://docs.rakwireless.com/product-categories/wisblock/rak15000/overview/
  mapping:
    2: GND
    7: I2C_SCL
    8: I2C_SDA
    9: 3V3 (NC)
    11: 3V3_S
    14: 3V3_S
    16: 3V3 (NC)
    17: I2C_SDA
    18: I2C_SCL
    23: GND
  i2c_address: '0x50'
  category: storage
  images:
  - https://images.docs.rakwireless.com/wisblock/rak15000/rak15000.png
  schematics:
  - https://images.docs.rakwireless.com/wisblock/rak15000/datasheet/schematic.png
  notes:
  - Change 3V3_S to 3V3 by swapping resistors R5 and R6
  - I2C address can be changed to 0x54 by moving resistor from R4 to R3
  tags:
  - eeprom
  - storage
  - memory
  - i2c
