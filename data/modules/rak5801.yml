rak5801:
  type: WisIO
  description: RAK5801 4-20mA Interface Module
  documentation: https://docs.rakwireless.com/product-categories/wisblock/rak5801/overview/
  mapping:
    1: VBAT
    2: VBAT
    3: GND
    4: GND
    5: 3V3 (NC)
    6: 3V3_S
    19: I2C_SDA
    20: I2C_SCL
    21: A0 (NC)
    22: A1
    29: ENABLE
    30: ENABLE (NC)
    32: A0
    39: GND
    40: GND
  category: io
  images:
  - https://images.docs.rakwireless.com/wisblock/rak5801/rak5801.png
  schematics:
  - https://images.docs.rakwireless.com/wisblock/rak5801/datasheet/schematic.png
  notes:
  - A0 signal is on pin 32 by default via R94, change it to R95 to enable secondary
  - EN signal is connected to pin 29 by default via R97, change it to R96 to enable
    secondary
  - Power via 3V3 swapping resistors R49 and R50
  tags:
  - 4-20ma
  - analog
  - industrial
  - current-loop
