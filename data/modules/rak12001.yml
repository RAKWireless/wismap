rak12001:
  type: WisSensor
  description: RAK12001 Fingerprint Sensor
  documentation: https://docs.rakwireless.com/product-categories/wisblock/rak12001/overview/
  mapping:
    1: UART_TX
    2: GND
    9: 3V3
    11: 3V3_S
    12: TOUCH
    13: TOUCH
    14: 3V3_S
    16: 3V3
    23: GND
    24: UART_RX
  category: io
  images:
  - https://images.docs.rakwireless.com/wisblock/rak12001/rak12001.png
  schematics:
  - https://images.docs.rakwireless.com/wisblock/rak12001/datasheet/schematic.png
  double: true
  notes:
  - The 3V3 line in the sensor connector uses 3V3 via R6, alternatively can use 3V3_S
    via R7
  - The 5V line in the sensor connector uses 3V3_S via R8 using a step up, alternatively
    can use 3V3_S via R9
  tags:
  - fingerprint
  - biometric
  - security
  - uart
