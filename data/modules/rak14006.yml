rak14006:
  type: WisIO
  description: RAK14006 Rotary Input Module
  documentation: https://docs.rakwireless.com/product-categories/wisblock/rak14006/overview/
  mapping:
    3: GND
    4: GND
    6: 3V3_S
    32: OUT_CCW
    37: SW
    38: OUT_CW
    39: GND
    40: GND
  category: io
  images:
  - https://images.docs.rakwireless.com/wisblock/rak14006/rak14006.png
  schematics:
  - https://images.docs.rakwireless.com/wisblock/rak14006/datasheet/signal-input.png
  - https://images.docs.rakwireless.com/wisblock/rak14006/datasheet/rotation-direction.png
  - https://images.docs.rakwireless.com/wisblock/rak14006/datasheet/pinout.png
  notes:
  - OUT_CCW can be changed to SIGNAL_B swapping resistors R7 and R8
  - OUT_CW can be changed to SIGNAL_A swapping resistors R9 and R10
  tags:
  - rotary
  - encoder
  - input
  - gpio
