rak13600:
  type: WisIO
  description: RAK13600 NFC Module
  documentation: https://docs.rakwireless.com/product-categories/wisblock/rak13600/overview/
  mapping:
    3: GND
    4: GND
    5: 3V3 (NC)
    6: 3V3_S
    19: I2C_SDA
    20: I2C_SCL
    25: SPI_NSS (NC)
    26: SPI_CLK (NC)
    27: SPI_MISO (NC)
    28: SPI_MOSI (NC)
    32: RSTPD_N
    33: I2C_SCL (NC)
    34: I2C_SDA (NC)
    37: RESET
    38: WAKE_UP_MCU
    39: GND
    40: GND
  i2c_address: '0x59'
  category: communication
  images:
  - https://images.docs.rakwireless.com/wisblock/rak13600/rak13600.png
  schematics:
  - https://images.docs.rakwireless.com/wisblock/rak13600/datasheet/schematic.png
  notes:
  - Disable 3V3_S removing R18
  - Enable 3V3 populating R17
  - Enable SPI interface populating R21, R22, R23 and R24
  - Change I2C signals removing R19 and R20 and populating R26 and R27
  tags:
  - nfc
  - rfid
  - contactless
  - spi
