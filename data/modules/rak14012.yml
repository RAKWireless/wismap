rak14012:
  type: WisIO
  description: RAK14012 LED Matrix
  documentation: https://docs.rakwireless.com/product-categories/wisblock/rak14012/overview/
  mapping:
    1: VBAT
    2: VBAT
    3: GND
    4: GND
    6: 3V3_S (NC)
    28: DOUT (NC)
    35: DOUT (NC)
    37: DOUT
    38: EN
    39: GND
    40: GND
  category: display
  images:
  - https://images.docs.rakwireless.com/wisblock/rak14012/rak14012.png
  schematics:
  - https://images.docs.rakwireless.com/wisblock/rak14012/datasheet/connector.png
  - https://images.docs.rakwireless.com/wisblock/rak14012/datasheet/boost.png
  - https://images.docs.rakwireless.com/wisblock/rak14012/datasheet/power.png
  - https://images.docs.rakwireless.com/wisblock/rak14012/datasheet/connector_for_led.png
  notes:
  - Change R7, R8 and R9 to enable different DOUT
  - Module can power the LED Matrix from VBAT using a step-up to 5V (optional, see
    J2 jumper)
  tags:
  - led
  - matrix
  - display
  - i2c
